<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Web Statis - HTML & Tailwind CSS</title>
    <!-- Script CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- HEADER -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="logo">
                <h2 class="text-xl font-bold tracking-wider text-indigo-400">Logo<span class="text-indigo-200">.</span></h2>
            </div>

                <ul class="flex gap-6 text-sm font-medium text-slate-300">

                    <li><a href="#fitur" class="hover:text-indigo-400 transition">Fitur</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- BODY / MAIN CONTENT -->
    <main class="flex-grow">
        <!-- Section 1: Pengenalan -->
        <section id="hero" class="hero-section min-h-[80vh] flex items-center justify-center px-6 py-16 text-center">
            <div class="hero-content max-w-3xl mx-auto">
                <span class="mb-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-sm">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                    Web Statis Modern
                </span>
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-6">
                    Pengenalan <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Website</span>
                </h1>
                <p class="text-slate-400 text-lg mb-3">Ini adalah bagian section pertama untuk pengenalan.</p>
                <p class="text-slate-4
